<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractal Lab — Interactive Geometry Explorer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>Fractal Lab</h1>
          <p class="tagline">Geometry · Self-similarity · Chaos</p>
        </div>
      </header>

      <section class="panel">
        <h2>Fractal</h2>
        <div class="fractal-grid" id="fractal-picker" role="listbox" aria-label="Choose fractal"></div>
      </section>

      <section class="panel">
        <h2>Parameters</h2>
        <div id="params" class="params"></div>
      </section>

      <section class="panel">
        <h2>Appearance</h2>
        <div class="control">
          <label for="bg-color">Background</label>
          <input type="color" id="bg-color" value="#0b0f14" />
        </div>
        <div class="control">
          <label for="stroke-color">Stroke / primary</label>
          <input type="color" id="stroke-color" value="#7dd3fc" />
        </div>
        <div class="control">
          <label for="fill-color">Fill / secondary</label>
          <input type="color" id="fill-color" value="#a78bfa" />
        </div>
        <div class="control">
          <label for="line-width">Line width <span class="val" id="line-width-val">1.5</span></label>
          <input type="range" id="line-width" min="0.25" max="6" step="0.25" value="1.5" />
        </div>
        <div class="control">
          <label class="checkbox">
            <input type="checkbox" id="gradient" checked />
            Depth gradient (color by iteration)
          </label>
        </div>
        <div class="control">
          <label class="checkbox">
            <input type="checkbox" id="filled" />
            Filled shapes
          </label>
        </div>
      </section>

      <section class="panel actions">
        <button type="button" id="btn-reset-view" class="btn ghost">Reset view</button>
        <button type="button" id="btn-reset-params" class="btn ghost">Reset params</button>
        <button type="button" id="btn-export" class="btn primary">Export PNG</button>
      </section>

      <footer class="sidebar-foot">
        <p>Scroll to zoom · Drag to pan · Double-click to reset</p>
      </footer>
    </aside>

    <main class="stage">
      <div class="stage-bar">
        <div class="info">
          <strong id="fractal-name">Sierpiński Triangle</strong>
          <span id="fractal-blurb" class="blurb"></span>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <canvas id="canvas" aria-label="Fractal canvas"></canvas>
      <div class="hud" id="hud"></div>
    </main>
  </div>

  <script src="fractals.js"></script>
  <script src="app.js"></script>
</body>
</html>
